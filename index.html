<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koccie Dashboard</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <nav class="tabs" id="tabs">
      <button data-tab="overview" class="on">Overview</button>
      <button data-tab="marketing">Marketing</button>
      <button data-tab="product">Product</button>
      <button data-tab="explorer">Explorer</button>
      <button data-tab="forecast">Forecast</button>
    </nav>
    <div class="rangebox">
      <label>Time Range</label>
      <select id="range">
        <option value="all">All (YTD)</option>
        <option value="30">Last 30 days</option>
        <option value="7">Last 7 days</option>
        <option value="yesterday">Yesterday</option>
        <option value="custom">Custom…</option>
      </select>
      <label class="cmpbox" id="cmpLabel" title="So sánh với kỳ trước (cùng độ dài)"><input type="checkbox" id="cmp"> Compare</label>
      <span id="customRange" style="display:none">
        <input type="date" id="cFrom"> → <input type="date" id="cTo">
      </span>
      <span class="gen" id="genAt"></span>
    </div>
  </header>

  <div id="kpi"></div>
  <main id="view"></main>

  <script src="./app.js"></script>
</body>
</html>
