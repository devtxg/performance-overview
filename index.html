<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koccie Performance 2026</title>
  <script>document.write('<link rel="stylesheet" href="./styles.css?_=' + Date.now() + '">');</script>   <!-- cache-bust: luôn lấy CSS mới -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brandtabs">
      <span class="brand">Koccie Performance 2026</span>
      <nav class="tabs" id="tabs">
        <button data-tab="overview" class="on">Overview</button>
        <button data-tab="marketing">Marketing</button>
        <button data-tab="product">Product</button>
      </nav>
    </div>
    <div class="rangebox">
      <label>Time Range</label>
      <select id="range">
        <option value="all">All (YTD)</option>
        <option value="30">Last 30 days</option>
        <option value="7">Last 7 days</option>
        <option value="yesterday">Yesterday</option>
        <option value="custom">Custom…</option>
      </select>
      <label class="cmpbox" id="cmpLabel" title="So sánh với kỳ trước (cùng độ dài)"><input type="checkbox" id="cmp"> Compare</label>
      <span id="customRange" style="display:none">
        <input type="date" id="cFrom"> → <input type="date" id="cTo">
      </span>
      <span class="gen" id="genAt"></span>
    </div>
  </header>

  <div id="kpi"></div>
  <main id="view"></main>

  <script>document.write('<script src="./app.js?_=' + Date.now() + '"><\/script>');</script>   <!-- cache-bust: luôn lấy app.js mới -->
</body>
</html>
